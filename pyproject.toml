[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader"
version = "0.1.1"
description = "Download YouTube videos, audio or transcripts"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]",
    "youtube-transcript-api>=1.2",
]

[project.scripts]
yt-downloader = "youtube_downloader:main"

[tool.setuptools]
py-modules = ["youtube_downloader"]
